<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="45%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Letter J & Stroke Gradient -->
    <linearGradient id="jGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- CMYK Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="112"
    ry="112"
    fill="url(#bgGrad)"
    filter="url(#softShadow)"
  />

  <!-- Subtle Inner Border Highlight -->
  <rect
    x="34"
    y="34"
    width="444"
    height="444"
    rx="110"
    ry="110"
    fill="none"
    stroke="#A5B4FC"
    stroke-width="3"
    stroke-opacity="0.35"
  />

  <!-- CMYK / Print Spectrum Accent Dots (Top Right) -->
  <g transform="translate(320, 96)">
    <!-- Cyan Dot -->
    <circle cx="0" cy="0" r="14" fill="url(#cyanGrad)" filter="url(#glow)" />
    <!-- Magenta Dot -->
    <circle cx="36" cy="0" r="14" fill="url(#magentaGrad)" filter="url(#glow)" />
    <!-- Yellow Dot -->
    <circle cx="72" cy="0" r="14" fill="url(#yellowGrad)" filter="url(#glow)" />
  </g>

  <!-- Modern Geometric Monogram "J" (Printing & Studio Motif) -->
  <g filter="url(#glow)">
    <!-- Top Horizontal Studio Bar -->
    <path
      d="M168 140 H344 C357.255 140 368 150.745 368 164 C368 177.255 357.255 188 344 188 H284 V300 C284 355.228 239.228 400 184 400 C138.455 400 100.177 369.588 88.587 328.272 C85.006 315.508 93.305 302.632 106.183 300.285 C119.06 297.939 131.642 306.992 135.034 319.82 C141.677 344.945 161.758 356 184 356 C214.928 356 240 330.928 240 300 V188 H168 C154.745 188 144 177.255 144 164 C144 150.745 154.745 140 168 140 Z"
      fill="url(#jGrad)"
    />

    <!-- Dynamic Print Swash / DTF Layer Arc -->
    <path
      d="M284 220 L350 220 C361.046 220 370 228.954 370 240 C370 251.046 361.046 260 350 260 L284 260 Z"
      fill="url(#cyanGrad)"
      opacity="0.9"
    />
    
    <path
      d="M284 276 L330 276 C339.941 276 348 284.059 348 294 C348 303.941 339.941 312 330 312 L284 312 Z"
      fill="url(#magentaGrad)"
      opacity="0.9"
    />

    <!-- Sparkle / Star (Creative Studio Accent) -->
    <path
      d="M380 136 C380 152 392 164 408 164 C392 164 380 176 380 192 C380 176 368 164 352 164 C368 164 380 152 380 136 Z"
      fill="#FDE047"
    />
  </g>
</svg>
